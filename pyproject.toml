[project]
name = "serverops"
version = "0.1.0"
description = "A safe, scriptable operations toolkit for Coolify and standalone deployments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "coolipy>=0.0.8",
  "httpx>=0.28,<1",
  "hvac>=2.4.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
serverops = "serverops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serverops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tools]
"ubi:tailscale/tailscale" = "latest"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
